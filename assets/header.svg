<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Changjun Market Engine</title>
  <desc id="desc">A dark causal market-engine banner with candlesticks and probability curves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0f2235"/>
      <stop offset="1" stop-color="#102b2b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <circle cx="1040" cy="44" r="170" fill="#14b8a6" opacity="0.06"/>
  <circle cx="180" cy="285" r="210" fill="#38bdf8" opacity="0.05"/>

  <g opacity="0.82">
    <path d="M740 225 C790 220 805 178 850 184 S925 118 970 132 S1040 78 1135 68" fill="none" stroke="url(#line)" stroke-width="4" filter="url(#glow)"/>
    <path d="M740 240 C795 236 835 222 880 216 S960 188 1005 196 S1080 158 1140 166" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.9"/>
  </g>

  <g stroke-linecap="round">
    <g transform="translate(785 0)"><line x1="0" y1="150" x2="0" y2="226" stroke="#2dd4bf" stroke-width="2"/><rect x="-8" y="170" width="16" height="34" rx="2" fill="#2dd4bf"/></g>
    <g transform="translate(830 0)"><line x1="0" y1="140" x2="0" y2="210" stroke="#fb7185" stroke-width="2"/><rect x="-8" y="158" width="16" height="30" rx="2" fill="#fb7185"/></g>
    <g transform="translate(875 0)"><line x1="0" y1="120" x2="0" y2="198" stroke="#2dd4bf" stroke-width="2"/><rect x="-8" y="142" width="16" height="38" rx="2" fill="#2dd4bf"/></g>
    <g transform="translate(920 0)"><line x1="0" y1="92" x2="0" y2="170" stroke="#2dd4bf" stroke-width="2"/><rect x="-8" y="112" width="16" height="40" rx="2" fill="#2dd4bf"/></g>
    <g transform="translate(965 0)"><line x1="0" y1="105" x2="0" y2="178" stroke="#fb7185" stroke-width="2"/><rect x="-8" y="122" width="16" height="32" rx="2" fill="#fb7185"/></g>
    <g transform="translate(1010 0)"><line x1="0" y1="72" x2="0" y2="150" stroke="#2dd4bf" stroke-width="2"/><rect x="-8" y="94" width="16" height="39" rx="2" fill="#2dd4bf"/></g>
    <g transform="translate(1055 0)"><line x1="0" y1="52" x2="0" y2="129" stroke="#2dd4bf" stroke-width="2"/><rect x="-8" y="72" width="16" height="40" rx="2" fill="#2dd4bf"/></g>
    <g transform="translate(1100 0)"><line x1="0" y1="65" x2="0" y2="138" stroke="#fb7185" stroke-width="2"/><rect x="-8" y="80" width="16" height="35" rx="2" fill="#fb7185"/></g>
  </g>

  <text x="72" y="116" fill="#f8fafc" font-family="'Times New Roman', Times, serif" font-size="43" font-weight="700" letter-spacing="1.5">CHANGJUN MARKET ENGINE</text>
  <text x="74" y="157" fill="#99f6e4" font-family="'Times New Roman', Times, serif" font-size="21" letter-spacing="4">STRUCTURE · LIQUIDITY · PROBABILITY</text>
  <line x1="74" y1="184" x2="590" y2="184" stroke="#38bdf8" stroke-width="2" opacity="0.72"/>
  <text x="74" y="222" fill="#cbd5e1" font-family="'Times New Roman', Times, serif" font-size="19">A causal multi-asset research engine for TradingView</text>
  <rect x="74" y="244" width="86" height="28" rx="14" fill="#14b8a6" opacity="0.2" stroke="#2dd4bf"/>
  <text x="117" y="264" text-anchor="middle" fill="#99f6e4" font-family="'Times New Roman', Times, serif" font-size="15" font-weight="700">REVISION 7</text>
</svg>
